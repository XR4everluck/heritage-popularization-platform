# ============================================================
# 非遗知识教学平台 后端配置
# ============================================================
server:
  port: 8080

spring:
  application:
    name: heritage-teaching-platform

  # ---------- 数据源 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库 heritage_teaching 由 sql/heritage_teaching_platform.sql 创建
    url: jdbc:mysql://localhost:3306/heritage_teaching?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # TODO：改成你本机 MySQL 的账号密码
    username: root
    password: "请修改为你的数据库密码"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------- 文件上传限制（阶段3文件上传使用） ----------
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # ---------- JSON序列化：统一时间格式 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# ---------- MyBatis-Plus ----------
mybatis-plus:
  # Mapper XML 文件位置（阶段3业务开发时使用）
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 数据库下划线字段自动映射 Java 驼峰属性（create_time -> createTime）
    map-underscore-to-camel-case: true
    # 开发期在控制台打印 SQL，便于调试；上线前删除该行
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键策略：数据库自增（与建表 SQL 保持一致）
      id-type: auto
      # 逻辑删除全局配置：实体含 deleted 字段即自动生效，无需逐个加 @TableLogic
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
